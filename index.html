<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BU-2691 — Расписание занятий</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='800' font-size='26' text-anchor='middle' fill='white'%3EBU%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#07070b;--bg2:#101016;--card:rgba(255,255,255,.055);--bd:rgba(255,255,255,.1);--tx:#f4f4f8;--mu:#9a9aab;--ac:#8b5cf6;--sh:0 10px 40px rgba(0,0,0,.45)}
:root[data-theme=light]{--bg:#f4f4f8;--bg2:#fff;--card:rgba(255,255,255,.7);--bd:rgba(0,0,0,.08);--tx:#14141c;--mu:#6b6b7b;--sh:0 10px 30px rgba(30,30,60,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,Geist,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden;transition:background .4s}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:float 22s ease-in-out infinite}
.b1{width:420px;height:420px;background:#6366f1;top:-120px;left:-100px}
.b2{width:380px;height:380px;background:#ec4899;top:30%;right:-140px;animation-delay:-7s}
.b3{width:340px;height:340px;background:#06b6d4;bottom:-120px;left:20%;animation-delay:-13s}
[data-theme=light] .blob{opacity:.22}
.shape{position:absolute;border:1px solid var(--bd);border-radius:28%;animation:spin 60s linear infinite}
.s1{width:220px;height:220px;top:18%;left:62%}.s2{width:120px;height:120px;top:62%;left:8%;animation-duration:80s}
.p{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.35;animation:rise 14s linear infinite}
@keyframes float{50%{transform:translate(60px,40px) scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 90px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#ec4899);display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
.btns{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);backdrop-filter:blur(16px);display:grid;place-items:center;cursor:pointer;transition:.25s}
.ib:hover{transform:translateY(-2px);box-shadow:0 0 20px rgba(139,92,246,.35)}
.ib:active{transform:scale(.94)}.ib svg{width:18px;height:18px;transition:transform .5s}.ib:hover svg{transform:rotate(18deg)}
.ib.spin svg{animation:spin .8s linear}
.hero{padding:44px 0 26px;animation:in .9s cubic-bezier(.2,.8,.2,1) both}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(12px);font-size:12.5px;color:var(--mu)}
.chip b{color:var(--tx);font-weight:600}
h1{font-size:clamp(40px,10vw,76px);line-height:1;letter-spacing:-.04em;font-weight:800}
h1 span{background:linear-gradient(100deg,#818cf8,#f472b6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:sh 8s ease infinite}
@keyframes sh{50%{background-position:100%}}
.sub{margin-top:14px;color:var(--mu);max-width:520px}
@keyframes in{from{opacity:0;transform:translateY(22px);filter:blur(6px)}}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:22px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--sh)}
.now{padding:20px;margin-bottom:20px;position:relative;overflow:hidden;animation:in .9s .15s both}
.now:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0 0,rgba(139,92,246,.25),transparent 60%);pointer-events:none}
.nl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 #22c55e;animation:pulse 2s infinite}
.dot.off{background:#71717a;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}}
.nt{font-size:22px;font-weight:700;margin:8px 0 2px;letter-spacing:-.02em}.ns{color:var(--mu);font-size:14px}
.bar{height:8px;border-radius:9px;background:var(--bd);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#6366f1,#ec4899);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:6px}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;animation:in .9s .25s both}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;padding:0 14px;height:44px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;min-width:0}
.search svg{width:16px;height:16px;color:var(--mu)}
.pill{height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;backdrop-filter:blur(16px);transition:.25s}
.pill:hover{transform:translateY(-2px)}.pill.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;color:#fff}
.tabs{position:sticky;top:0;z-index:5;display:flex;padding:5px;gap:2px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;position:relative}
.tabs button{flex:1;position:relative;z-index:1;padding:10px 6px;min-width:64px;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;font-size:13px;cursor:pointer;border-radius:16px;transition:color .3s}
.tabs button.act{color:#fff}.tabs button small{display:block;font-weight:500;opacity:.7;font-size:11px}
.pillbg{position:absolute;top:5px;bottom:5px;border-radius:16px;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 6px 20px rgba(139,92,246,.45);transition:left .45s cubic-bezier(.3,1.2,.4,1),width .45s cubic-bezier(.3,1.2,.4,1)}
.dh{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px}.dh h2{font-size:18px;letter-spacing:-.02em}
.list{display:grid;gap:12px;touch-action:pan-y}
.card{--c:#8b5cf6;padding:18px;position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s;animation:in .55s calc(var(--i)*70ms) cubic-bezier(.2,.8,.2,1) both}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 44px color-mix(in srgb,var(--c) 35%,transparent);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.card.live{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 12px 50px color-mix(in srgb,var(--c) 40%,transparent)}
.cn{font:700 13px/1 ui-monospace,monospace;color:var(--c);display:flex;justify-content:space-between;align-items:center}
.cn em{font-style:normal;font-size:11px;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.cname{font-size:19px;font-weight:650;margin:12px 0 6px;letter-spacing:-.02em}
.ct{color:var(--mu);font-size:14px;display:flex;align-items:center;gap:6px}
.ci{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:14px}
.ci span{display:flex;gap:6px;align-items:center}.ci svg{width:15px;height:15px;color:var(--c)}
.rm{position:absolute;right:12px;bottom:12px;border:0;background:none;color:var(--mu);cursor:pointer;opacity:.6;padding:6px}.rm:hover{opacity:1;color:#f87171}
.add{margin-top:12px;width:100%;height:52px;border-radius:18px;border:1.5px dashed var(--bd);background:none;color:var(--mu);font:inherit;font-weight:600;cursor:pointer;transition:.25s}
.add:hover{border-color:var(--ac);color:var(--tx)}
.empty{padding:44px 20px;text-align:center;color:var(--mu);animation:in .5s both}.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:4px}
.sk{height:118px;border-radius:22px;background:linear-gradient(100deg,var(--card) 30%,rgba(255,255,255,.12) 50%,var(--card) 70%);background-size:300%;animation:skm 1.2s infinite}
@keyframes skm{to{background-position:-100% 0}}
.mod{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.mod.open{display:flex;animation:fd .25s}@keyframes fd{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:82vh;overflow:auto;padding:20px;border-radius:26px 26px 0 0;background:var(--bg2);border:1px solid var(--bd);animation:up .4s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{margin-bottom:12px}.pairs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--ac);transform:translateX(3px)}.opt small{display:block;color:var(--mu)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,30px);opacity:0;padding:11px 18px;border-radius:99px;background:var(--tx);color:var(--bg);font-weight:600;font-size:14px;transition:.35s;z-index:30;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.note{margin-top:26px;font-size:12.5px;color:var(--mu);text-align:center}
@media (prefers-reduced-motion:reduce){*,*:before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="shape s1"></div><div class="shape s2"></div><div id="ps"></div></div>
<div class="wrap">
 <div class="top"><div class="logo"><i>BU</i>BU-2691</div>
  <div class="btns"><button class="ib" id="bRef" title="Обновить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
  <button class="ib" id="bShare" title="Поделиться"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
  <button class="ib" id="bCopy" title="Скопировать день"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
  <button class="ib" id="bTheme" title="Тема"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path id="ti" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div></div>
 <section class="hero"><div class="chips" id="chips"></div>
  <h1>Твоё расписание.<br><span>Твой ритм.</span></h1>
  <p class="sub" id="gi"></p></section>
 <div class="glass now" id="now"></div>
 <div class="tools"><label class="glass search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="q" placeholder="Предмет или преподаватель"></label>
  <button class="pill" id="bToday">Сегодня</button><button class="pill" id="bWeek">Эта неделя</button></div>
 <div class="glass tabs" id="tabs"></div>
 <div class="dh"><h2 id="dt"></h2><span class="ns" id="dc"></span></div>
 <div class="list" id="list"></div>
 <p class="note">Среда — выходной. В субботу после 2-й пары перемена 10 минут.</p>
</div>
<div class="mod" id="mod"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===== DATA / CONFIG — редактируется без изменения дизайна ===== */
const CONFIG={
 group:"БУ-2691",course:1,college:"Колледж",
 days:["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"],
 // Звонки: [начало, конец, начало короткой перемены внутри пары, её конец]
 bells:[["09:00","10:35","09:45","09:50"],["10:45","12:20","11:30","11:35"],["12:50","14:25","13:35","13:40"],["14:35","16:05","15:20","15:25"]],
 // Суббота: после 2-й пары перемена 10 минут вместо 30
 bellsSat:[["09:00","10:35","09:45","09:50"],["10:45","12:20","11:30","11:35"],["12:30","14:05","13:15","13:20"],["14:15","15:45","15:00","15:05"]],
 // Дисциплины, извлечённые из столбца БУ-2691 скриншота
 lessons:[
  {id:"eo1",name:"Экономика организации (I подгруппа)",teacher:"Афанасьева А.А.",room:"1330",sub:"I подгруппа",c:"#8b5cf6"},
  {id:"eo2",name:"Экономика организации (II подгруппа)",teacher:"Афанасьева А.А.",room:"1330",sub:"II подгруппа",c:"#8b5cf6"},
  {id:"eo",name:"Экономика организации",teacher:"Афанасьева А.А.",room:"1330",c:"#8b5cf6"},
  {id:"ya",name:"Ин. язык в ПД",teacher:"Кривоносова Е.Н.",room:"2301",c:"#06b6d4"},
  {id:"mat",name:"Математика",teacher:"Рябова Л.М.",room:"1308",c:"#f59e0b"},
  {id:"ist",name:"История России",teacher:"Барбасова В.В.",room:"1314",c:"#ef4444"},
  {id:"dou",name:"ДОУ",teacher:"Акуличева О.Ю.",room:"1217",c:"#10b981"},
  {id:"bzd",name:"БЖД",teacher:"Игнатенко В.М.",room:"1214",c:"#f97316"},
  {id:"fk",name:"Физическая культура",teacher:"Часов А.Н. / Баданин А.С.",room:"с/з",c:"#22c55e"},
  {id:"ofg",name:"Основы финансовой грамотности",teacher:"Рябова Е.С.",room:"1212",c:"#ec4899"},
  {id:"fdok",name:"ФДОК",teacher:"Шморина И.А.",room:"1331",c:"#6366f1"}
 ],
 // Расписание по неделям: {день(0-5): [{pair:1..6, lesson:"id"}]}. Пусто — заполняется в интерфейсе.
 off:[2],
 schedule:{
  0:[{pair:1,lesson:"eo1"},{pair:2,lesson:"ya"},{pair:3,lesson:"mat"},{pair:4,lesson:"eo2"}],
  1:[{pair:1,lesson:"ist"},{pair:2,lesson:"dou"},{pair:3,lesson:"bzd"},{pair:4,lesson:"ist"}],
  3:[{pair:1,lesson:"eo"},{pair:2,lesson:"fk"},{pair:3,lesson:"mat"}],
  4:[{pair:1,lesson:"ofg"},{pair:2,lesson:"mat"},{pair:3,lesson:"eo"},{pair:4,lesson:"fdok"}],
  5:[{pair:2,lesson:"eo"},{pair:3,lesson:"fdok"},{pair:4,lesson:"fdok"}]
 }
};
/* ===== APP ===== */
const $=s=>document.querySelector(s),L=Object.fromEntries(CONFIG.lessons.map(l=>[l.id,l]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const now0=new Date(),todayIdx=(now0.getDay()+6)%7;
let theme=ls.get("theme","dark"),day=ls.get("day",todayIdx>5?0:todayIdx),wk=0,query="",data=ls.get("sched2",structuredClone({w0:CONFIG.schedule,w1:CONFIG.schedule}));
const bell=(d,p)=>(d==5?CONFIG.bellsSat:CONFIG.bells)[p-1];const pad=n=>String(n).padStart(2,"0"),mins=t=>+t.slice(0,2)*60+ +t.slice(3);
const key=()=>"w"+wk,get=d=>((data[key()]||{})[d]||[]).slice().sort((a,b)=>a.pair-b.pair);
const save=()=>ls.set("sched2",data),ls_save=()=>ls.set("day",day);
const mon=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-todayIdx+wk*7);return d};
const dateOf=i=>{const d=mon();d.setDate(d.getDate()+i);return d};
const fmt=(d,o)=>d.toLocaleDateString("ru-RU",o);
const icon=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',pin:'<path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>'};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2000)}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7)}
function header(){
 $("#chips").innerHTML=`<span class="chip"><b>${fmt(now0,{weekday:"long"})}</b>, ${fmt(now0,{day:"numeric",month:"long"})}</span><span class="chip">Неделя <b>${isoWeek(dateOf(0))}</b></span><span class="chip">${CONFIG.course} курс</span><span class="chip">${CONFIG.college}</span>`;
 $("#gi").textContent=`Расписание занятий · группа ${CONFIG.group}. Сегодня: ${todayIdx>5||CONFIG.off.includes(todayIdx)?"выходной":CONFIG.days[todayIdx].toLowerCase()+", "+get(todayIdx).length+" пар"}.`;
 $("#bWeek").textContent=wk?"Следующая неделя":"Эта неделя";$("#bWeek").classList.toggle("on",!!wk);
}
function tabs(){
 const t=$("#tabs");t.innerHTML='<div class="pillbg" id="pb"></div>'+CONFIG.days.map((n,i)=>`<button data-i="${i}" class="${i==day?"act":""}">${n.slice(0,2).toUpperCase()}<small>${get(i).length||"–"}</small></button>`).join("");
 t.querySelectorAll("button").forEach(b=>b.onclick=()=>setDay(+b.dataset.i));moveBg();
}
function moveBg(){const b=$("#tabs button.act"),p=$("#pb");if(b&&p){p.style.left=b.offsetLeft+"px";p.style.width=b.offsetWidth+"px"}}
function setDay(i){day=Math.max(0,Math.min(5,i));ls_save();tabs();render()}
function card(x,i){const l=L[x.lesson],[s,e]=bell(day,x.pair),cur=wk==0&&day==todayIdx&&nowMin()>=mins(s)&&nowMin()<mins(e);
 return `<article class="glass card ${cur?"live":""}" style="--c:${l.c};--i:${i}"><div class="cn"><span>${pad(x.pair)}</span>${l.sub?`<em>${l.sub}</em>`:cur?"<em>Идёт сейчас</em>":""}</div><div class="cname">${l.name}</div><div class="ct">${icon(I.clock)}${s} – ${e}</div><div class="ci"><span>${icon(I.user)}${l.teacher}</span><span>${icon(I.pin)}${/^\d/.test(l.room)?"Аудитория "+l.room:l.room==="с/з"?"Спортзал":l.room}</span></div><button class="rm" data-p="${x.pair}" data-l="${x.lesson}" title="Убрать">${icon('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>')}</button></article>`}
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function render(){
 const d=dateOf(day),items=get(day),q=query.trim().toLowerCase();
 $("#dt").textContent=fmt(d,{weekday:"long",day:"numeric",month:"long"});
 const f=items.filter(x=>!q||(L[x.lesson].name+L[x.lesson].teacher).toLowerCase().includes(q));
 $("#dc").textContent=`${items.length} ${items.length%10==1&&items.length!=11?"занятие":items.length%10>1&&items.length%10<5&&(items.length<10||items.length>20)?"занятия":"занятий"}`;
 const lst=$("#list");
 lst.innerHTML=(f.length?f.map(card).join(""):`<div class="glass empty"><b>${q?"Ничего не найдено":(CONFIG.off.includes(day)?"Выходной день":wk==0&&day==todayIdx?"Сегодня занятий нет":"Занятий нет")}</b>${q?"Попробуй другой запрос":"Добавь пары кнопкой ниже"}</div>`)+`<button class="add" id="add">+ Добавить занятие</button>`;
 lst.querySelectorAll(".rm").forEach(b=>b.onclick=()=>{const a=data[key()][day];data[key()][day]=a.filter(x=>!(x.pair==b.dataset.p&&x.lesson==b.dataset.l));save();tabs();render();header();toast("Занятие удалено")});
 $("#add").onclick=openAdd;nowCard();
}
function nowCard(){
 const n=$("#now");let dot="",t="",s="",pr=null,lb="";
 const items=get(todayIdx),m=nowMin(),BL=p=>bell(todayIdx,p);
 if(todayIdx>5||CONFIG.off.includes(todayIdx)){dot="off";t="Сегодня выходной";s="Отдыхай — расписание вернётся в понедельник"}
 else if(!items.length){dot="off";t="Сегодня занятий нет";s="Добавь пары в расписание дня"}
 else{
  const cur=items.find(x=>m>=mins(BL(x.pair)[0])&&m<mins(BL(x.pair)[1]));
  const nxt=items.find(x=>mins(BL(x.pair)[0])>m);
  if(cur){const[a,b]=BL(cur.pair).slice(0,2).map(mins);dot="";t=(m>=mins(BL(cur.pair)[2])&&m<mins(BL(cur.pair)[3]))?"Короткая перемена внутри пары":"Сейчас идёт занятие";s=`${L[cur.lesson].name} · ${L[cur.lesson].room==="с/з"?"спортзал":"ауд. "+L[cur.lesson].room}`;pr=(m-a)/(b-a)*100;lb=[`Прошло ${m-a} мин`,`Осталось ${b-m} мин`]}
  else if(nxt){const a=mins(BL(nxt.pair)[0]),prev=items.some(x=>mins(BL(x.pair)[1])<=m);dot="";t=prev?"Сейчас перемена":"Занятия ещё не начались";s=`До следующей пары осталось ${a-m} мин — ${L[nxt.lesson].name}`}
  else{dot="off";t="Занятия на сегодня закончились";s="Хорошего вечера!"}
 }
 n.innerHTML=`<div class="nl"><span class="dot ${dot}"></span>Сейчас</div><div class="nt">${t}</div><div class="ns">${s}</div>${pr!==null?`<div class="bar"><i id="pr"></i></div><div class="bl"><span>${lb[0]}</span><span>${lb[1]}</span></div>`:""}`;
 if(pr!==null)requestAnimationFrame(()=>requestAnimationFrame(()=>{$("#pr").style.width=pr+"%"}));
}
let addPair=1;
function openAdd(){
 const m=$("#mod"),sh=$("#sheet");
 const draw=()=>{sh.innerHTML=`<h3>${CONFIG.days[day]} — добавить занятие</h3><div class="pairs">${(day==5?CONFIG.bellsSat:CONFIG.bells).map((b,i)=>`<button class="pill ${i+1==addPair?"on":""}" data-p="${i+1}">${i+1} пара<small style="opacity:.7;font-size:11px"> ${b[0]}</small></button>`).join("")}</div>${CONFIG.lessons.map(l=>`<button class="opt" data-l="${l.id}">${l.name}<small>${l.teacher} · ${l.room}</small></button>`).join("")}`;
  sh.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{addPair=+b.dataset.p;draw()});
  sh.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{(data[key()]=data[key()]||{})[day]=(data[key()][day]||[]).concat({pair:addPair,lesson:b.dataset.l});save();m.classList.remove("open");tabs();render();header();toast("Занятие добавлено")})};
 draw();m.classList.add("open");
}
$("#mod").onclick=e=>{if(e.target.id=="mod")e.target.classList.remove("open")};
function dayText(){const items=get(day);return `${CONFIG.group} · ${fmt(dateOf(day),{weekday:"long",day:"numeric",month:"long"})}\n`+(items.length?items.map(x=>{const l=L[x.lesson],b=bell(day,x.pair);return `${x.pair}. ${b[0]}–${b[1]} ${l.name}, ${l.teacher}, ауд. ${l.room}`}).join("\n"):"Занятий нет")}
$("#bCopy").onclick=async()=>{try{await navigator.clipboard.writeText(dayText());toast("Скопировано")}catch(e){toast("Не удалось скопировать")}};
$("#bShare").onclick=async()=>{if(navigator.share){try{await navigator.share({title:"Расписание "+CONFIG.group,text:dayText()})}catch(e){}}else $("#bCopy").click()};
$("#bRef").onclick=()=>{const b=$("#bRef");b.classList.add("spin");data=ls.get("sched2",structuredClone({w0:CONFIG.schedule,w1:CONFIG.schedule}));$("#list").innerHTML='<div class="sk"></div><div class="sk"></div>';setTimeout(()=>{b.classList.remove("spin");tabs();render();header();toast("Расписание обновлено")},700)};
$("#bTheme").onclick=()=>{theme=theme=="dark"?"light":"dark";ls.set("theme",theme);applyTheme()};
function applyTheme(){document.documentElement.dataset.theme=theme;$("#ti").setAttribute("d",theme=="dark"?"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z":"M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z")}
$("#bToday").onclick=()=>{wk=0;if(todayIdx>5){setDay(0);toast("Сегодня выходной")}else setDay(todayIdx);header()};
$("#bWeek").onclick=()=>{wk=wk?0:1;header();tabs();render()};
$("#q").oninput=e=>{query=e.target.value;render()};
let sx=0,sy=0;const L2=$("#list");
L2.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
L2.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)setDay(day+(dx<0?1:-1))},{passive:true});
addEventListener("resize",moveBg);
for(let i=0;i<14;i++){const p=document.createElement("i");p.className="p";p.style.cssText=`left:${Math.random()*100}%;animation-delay:-${Math.random()*14}s;animation-duration:${12+Math.random()*12}s`;$("#ps").appendChild(p)}
applyTheme();header();
$("#list").innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
setTimeout(()=>{tabs();render()},650);
setInterval(()=>{nowCard()},30000);
</script></body></html>
