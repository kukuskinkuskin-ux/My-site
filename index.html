  }).filter(Boolean);
}
function t(st, txt, size, color, bold) {
  const x = st.addText(txt);
  x.font = bold ? Font.boldSystemFont(size) : Font.systemFont(size);
  x.textColor = new Color(color);
  return x;
}
const w = new ListWidget();
const g = new LinearGradient();
g.colors = [new Color("#0b0b14"), new Color("#2a1250")];
g.locations = [0, 1];
w.backgroundGradient = g;
w.setPadding(14, 14, 14, 14);
const fam = config.widgetFamily || "medium";
if (!S) {
  t(w, "БУ-2691", 12, "#9a9aab", true);
  t(w, "Нет данных. Проверь интернет и открой виджет ещё раз.", 13, "#ffffff", false);
} else {
  const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
  let list = day(now);
  const cur = list.find(x => m >= tm(x.s) && m < tm(x.e));
  const nxt = list.find(x => tm(x.s) > m);
  let main = cur || nxt, label = cur ? "СЕЙЧАС" : "ДАЛЬШЕ";
  if (!main) {
    label = "ВЫХОДНОЙ";
    for (let k = 1; k <= 7; k++) {
      const d = new Date(now.getTime() + k * 864e5), l = day(d);
      if (l.length) { list = l; main = l[0]; label = k == 1 ? "ЗАВТРА" : d.toLocaleDateString("ru-RU", { weekday: "long" }).toUpperCase(); break; }
    }
  }
  const hd = w.addStack();
  t(hd, "БУ-2691", 11, "#9a9aab", true);
  hd.addSpacer();
  t(hd, label, 11, "#a78bfa", true);
  w.addSpacer(8);
  if (main) {
    const l = main.l;
    t(w, l.name, fam == "small" ? 15 : 18, "#ffffff", true).lineLimit = 2;
    w.addSpacer(4);
    t(w, main.s + "–" + main.e + " · " + (/^\d/.test(l.room) ? "ауд. " + l.room : "спортзал"), 12, l.c, true);
    if (fam != "small") t(w, l.teacher, 12, "#9a9aab", false);
    if (cur) t(w, "до конца " + fm(tm(main.e) - m), 12, "#ffffff", true);
    else if (label == "ДАЛЬШЕ" && tm(main.s) - m < 180) t(w, "через " + fm(tm(main.s) - m), 12, "#ffffff", true);
    if (main.note) t(w, "⚡ изменение", 11, "#fbbf24", true);
    if (fam != "small") {
      w.addSpacer();
      const rest = list.filter(x => x !== main && tm(x.s) >= tm(main.s)).slice(0, fam == "large" ? 6 : 2);
      rest.forEach(x => { t(w, x.s + "  " + x.l.name, 12, "#cfcfe0", false).lineLimit = 1; });
    }
  } else {
    t(w, "Занятий нет — отдыхай", 15, "#ffffff", true);
  }
}
w.refreshAfterDate = new Date(Date.now() + 5 * 60000);
Script.setWidget(w);
if (!config.runsInWidget) await w.presentMedium();
Script.complete();
